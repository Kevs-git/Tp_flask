<!DOCTYPE html>
<html lang="fr">
<head>

    <title>{% block titre %}Mes tâches{% endblock %}</title>
</head>
<body>

        <a href="{{ url_for('index') }}">Accueil</a> | <a href="{{ url_for('ajouter') }}">Ajouter</a>

    {% endblock %}
</body>
</html>
